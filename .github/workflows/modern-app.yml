name: modern_app

on:
  pull_request:
    branches: [main]
    paths:
      - "modern_app/**"
      - "web/db/schema.rb"
      - ".github/workflows/modern-app.yml"
  push:
    branches: [main]
    paths:
      - "modern_app/**"
      - "web/db/schema.rb"
      - ".github/workflows/modern-app.yml"

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern_app

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: rr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modern_app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Load baseline schema
        run: DATABASE_URL=$TEST_DATABASE_URL bash scripts/db-setup.sh

      - run: npm test
      - run: npm run build
