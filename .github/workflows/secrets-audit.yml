name: Secrets audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan (git history and working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git scanning
          persist-credentials: false
      - name: Run gitleaks (scan git history)
        run: |
          docker run --rm --network none \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --redact --exit-code=1

  trufflehog:
    name: TruffleHog scan (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate time-limited ciphertext exceptions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/test_trufflehog_exceptions.py
          python3 .github/scripts/trufflehog_exceptions.py "$GITHUB_WORKSPACE" \
            .github/trufflehog-exceptions.json "$RUNNER_TEMP/trufflehog-exceptions"
      - name: Verify offline detection with a synthetic fixture
        run: |
          mkdir -p "$RUNNER_TEMP/trufflehog-fixture"
          printf 'token = %s%s\n' 'ghp_' 'a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8' > "$RUNNER_TEMP/trufflehog-fixture/fixture.txt"
          set +e
          docker run --rm --network none -v "$RUNNER_TEMP/trufflehog-fixture:/scan:ro" trufflesecurity/trufflehog:3.100.1 filesystem /scan --no-verification --no-update --fail --fail-on-scan-errors >/dev/null 2>&1
          result=$?
          set -e
          test "$result" -eq 183 || { echo "Synthetic detection failed or scanner unavailable (exit $result)"; exit 1; }
          echo 'Synthetic scanner fixture detected (contents withheld).'
      - name: Run trufflehog offline (filesystem)
        run: |
          set +e
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/trufflehog-exceptions:/exceptions:ro" trufflesecurity/trufflehog:3.100.1 filesystem /repo --exclude-paths /exceptions --no-verification --no-update --fail --fail-on-scan-errors >/dev/null 2>&1
          result=$?
          set -e
          if [ "$result" -eq 183 ]; then echo 'Potential secret detected; details withheld.'; exit 1; fi
          if [ "$result" -ne 0 ]; then echo "Scanner failed (exit $result)."; exit 1; fi
          echo 'Offline filesystem scan passed.'
